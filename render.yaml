# Render Blueprint for the ATB Collections controlled pilot (synthetic data, mock adapters, no real integrations).
# Render dashboard → New → Blueprint → select this repository and branch → Apply.
# Always-on paid plans (web "starter", database "basic-256mb") keep the worker running between visits and keep the
# data beyond Render's free-database lifetime; switch both back to "free" for a cost-free demo (see DEPLOYMENT.md).
databases:
  - name: atb-collections-db
    databaseName: atb_collections
    user: atb
    plan: basic-256mb     # paid: data kept for the whole pilot; "free" databases are deleted after Render's free period
    region: frankfurt

services:
  - type: web
    name: atb-collections
    runtime: docker
    plan: starter         # paid: always on, so reminders, aging and the dialer worker run between visits
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/ready   # 200 only when the database is reachable and every migration is applied
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atb-collections-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_MODE
        value: PILOT       # individual tester identities (pilot-users.json), no shared demo logins, no role switch
      - key: DEMO_CLOCK_MODE
        value: offset
      - key: PGBOSS_SCHEMA
        value: pgboss
      - key: CONNECTOR_CORE_BANKING
        value: mock
      - key: CONNECTOR_PAYMENT_FEED
        value: mock
      - key: CONNECTOR_SMS
        value: mock
      - key: CONNECTOR_DIALER
        value: mock
      - key: CONNECTOR_IDENTITY
        value: local-demo
